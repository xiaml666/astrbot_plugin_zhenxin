name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # This repository is published as a series of small area commits (so the
      # GitHub file list has meaningful English descriptions).  Some of those
      # intermediate commits intentionally contain only part of the tree; do
      # not spam failure emails for them.  Run the real checks only once the
      # plugin entry point, schema, core and tests are all present.
      - name: Check snapshot completeness
        id: complete
        run: |
          if [ -f main.py ] && [ -f metadata.yaml ] && [ -f _conf_schema.json ] \
             && [ -f src/zhenxin/engine.py ] && [ -f tests/test_pipeline.py ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Partial publication commit: skipping tests (not a code failure)."
          fi
      - name: Install test dependencies
        if: steps.complete.outputs.ok == 'true'
        run: python -m pip install --upgrade pip pyyaml
      - name: Run unit tests
        if: steps.complete.outputs.ok == 'true'
        run: python -m unittest discover -s tests -t .
      - name: Build plugin zip
        if: steps.complete.outputs.ok == 'true'
        run: python scripts/package_plugin.py
      - uses: actions/upload-artifact@v4
        if: steps.complete.outputs.ok == 'true'
        with:
          name: plugin-zip-py${{ matrix.python-version }}
          path: dist/*.zip
