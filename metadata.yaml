name: astrbot_plugin_zhenxin
display_name: 真心
short_desc: 虚拟不代表冰冷，每一个ta都带着真心。不换模型的长期记忆与上下文层：默认不检索、写记忆零 LLM 调用，记忆会按重要度自动分池与遗忘。
desc: >-
  虚拟不代表冰冷，每一个ta都带着真心。
  真心不换模型，只决定每一轮让模型看到什么。平时只带 3 条长期线索，出现“你还记得…”才翻旧记忆；
  写记忆零 LLM 调用，线索放请求末尾、稳定前缀不动，缓存持续命中。
  记忆按艾宾浩斯式周期分入周期池/珍藏池/浅忆池，零价值信息进回收池定期删除；
  说话偏好只学你明确说过的要求，不模仿口头禅；低频只学“怎么说话/接话/共情”，
  不跟聊天话题走、不学话题内容；搜索会核对结果域名，模型甄别剔除广告，最多 500 字；
  对话分段默认开启（移植对话分段Pro的智能/均衡切分，引用/图片/表情各归其位，不额外调用模型）、
  主动消息、插件冲突体检和页面内反馈通道。
  相比每轮检索或自动压缩的记忆方案，真心把线索放在请求末尾、写记忆不调用模型，缓存命中更稳、成本更低。
  不建议与其他接管上下文的记忆插件、每轮自动压缩/总结插件同时开启；共存时把 l3.host_context_mode 设为 off。
version: 0.6.10
author: xiaml666
repo: https://github.com/xiaml666/astrbot_plugin_zhenxin
