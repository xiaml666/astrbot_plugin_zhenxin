[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhenxin-context"
version = "0.5.0"
description = "Cache-aware, local-first context layer for QQ/WeChat chat bots (AstrBot / NoneBot2)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "zhenxin contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhenxin = ["py.typed"]








